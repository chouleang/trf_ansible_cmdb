---
- name: Bootstrap Docker + Nginx on web servers
  hosts: web_servers
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and Python SDK
      apt:
        name:
          - docker.io
          - python3-docker
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Pull nginx image
      community.docker.docker_image:
        name: nginx:latest
        source: pull
        state: present

    - name: Run nginx container
      community.docker.docker_container:
        name: nginx
        image: nginx:latest
        state: started
        restart_policy: always
        ports:
          - "80:80"